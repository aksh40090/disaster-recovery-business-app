name: Order Service CI/CD
on:
  push:
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service.yml"
permissions:
  contents: read
  packages: write
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/order-service/package.json
      - name: Install dependencies
        working-directory: services/order-service
        run: npm install
      - name: Run tests
        working-directory: services/order-service
        run: npm test
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/order-service:${{ github.sha }} \
            services/order-service
      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/order-service:${{ github.sha }}
